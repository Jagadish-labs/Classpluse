services:
  - type: web
    name: classpulse
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO
        value: "1"
      - key: TZ
        value: Asia/Kolkata
      - key: NODE_VERSION
        value: 22.12.0
      - key: SECRET
        generateValue: true